{name: Atualizar base do dashboard, 'on': {schedule: [{cron: 0 12 11 * *}], workflow_dispatch: {inputs: {refazer: {description: reprocessar uma competencia da ANS (AAAAMM), type: string, default: ''}, descobrir: {description: refazer o mapa unidade->CNES, type: boolean, default: false}, pular_auto: {description: pular a rodada automatica, type: boolean, default: false}}}}, permissions: {contents: write}, jobs: {atualizar: {runs-on: ubuntu-latest, timeout-minutes: 330, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: '3.12'}}, {name: dependencias, run: pip install requests}, {name: restaura cache, uses: actions/cache/restore@v4, with: {path: .cache, key: 'insumos-${{ github.run_id }}', restore-keys: insumos-}}, {name: disco, run: df -h / && du -sh .cache 2>/dev/null || true}, {name: refazer competencia da ans, if: '${{ inputs.refazer != '''' }}', run: 'python atualizador.py --refazer ${{ inputs.refazer }}'}, {name: mapa cnes, if: '${{ inputs.descobrir == true }}', run: python atualizador.py --cnes-descobrir}, {name: coletar, if: '${{ inputs.pular_auto != true }}', run: python atualizador.py --auto}, {name: sondagem cnj, continue-on-error: true, run: python atualizador.py --cnj}, {name: publicar, if: '${{ always() }}', run: bash publicar.sh}, {name: guarda cache, if: '${{ always() }}', uses: actions/cache/save@v4, with: {path: .cache, key: 'insumos-${{ github.run_id }}'}}]}}}

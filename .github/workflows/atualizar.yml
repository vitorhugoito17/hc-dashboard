{name: Atualizar base do dashboard, 'on': {schedule: [{cron: 0 12 11 * *}], workflow_dispatch: {inputs: {refazer: {description: reprocessar uma competencia da ANS (AAAAMM), type: string, default: ''}, descobrir: {description: refazer o mapa unidade->CNES, type: boolean, default: false}, so_cnj: {description: rodar so a judicializacao (painel do CNJ), type: boolean, default: false}, explorar: {description: so mapear o schema das bases da ANS e calibrar leitos por UF, type: boolean, default: false}}}}, permissions: {contents: write}, jobs: {atualizar: {runs-on: ubuntu-latest, timeout-minutes: 330, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: '3.12'}}, {name: dependencias, run: pip install requests}, {name: restaura cache, uses: actions/cache/restore@v4, with: {path: .cache, key: 'insumos-${{ github.run_id }}', restore-keys: insumos-}}, {name: disco, run: df -h / && du -sh .cache 2>/dev/null || true}, {name: schema das bases da ans, if: '${{ inputs.explorar == true }}', continue-on-error: true, run: python atualizador.py --explorar}, {name: calibra leitos por uf, if: '${{ inputs.explorar == true }}', continue-on-error: true, run: python atualizador.py --leitos-uf}, {name: refazer competencia da ans, if: '${{ inputs.refazer != '''' }}', run: 'python atualizador.py --refazer ${{ inputs.refazer }}'}, {name: mapa cnes, if: '${{ inputs.descobrir == true }}', run: python atualizador.py --cnes-descobrir}, {name: coletar, if: '${{ inputs.so_cnj != true && inputs.explorar != true }}', run: python atualizador.py --auto}, {name: so judicializacao, if: '${{ inputs.so_cnj == true }}', run: python atualizador.py --cnj}, {name: embutir base no html, if: '${{ always() }}', run: python atualizador.py --embutir}, {name: publicar, if: '${{ always() }}', run: bash publicar.sh}, {name: guarda cache, if: '${{ always() }}', uses: actions/cache/save@v4, with: {path: .cache, key: 'insumos-${{ github.run_id }}'}}]}}}

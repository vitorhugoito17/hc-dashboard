name: Atualizar base do dashboard
on: {schedule: [{cron: 0 12 11 * *}], workflow_dispatch: {}}
permissions: {contents: write}
jobs: {atualizar: {runs-on: ubuntu-latest, timeout-minutes: 90, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: 3.12}}, {name: dependencias, run: pip install requests}, {name: coletar, run: python atualizador.py}, {name: publicar, run: bash publicar.sh}]}}

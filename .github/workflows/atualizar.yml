name: Atualizar base do dashboard
on: {schedule: [{cron: 0 12 11 * *}], workflow_dispatch: {inputs: {descobrir: {description: refazer o mapa unidade->CNES, type: boolean, default: false}, so_cnj: {description: rodar so a sondagem do CNJ, type: boolean, default: false}}}}
permissions: {contents: write}
jobs: {atualizar: {runs-on: ubuntu-latest, timeout-minutes: 300, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: '3.12'}}, {name: dependencias, run: pip install requests}, {name: disco, run: df -h /}, {name: mapa cnes, if: "${{ inputs.descobrir == true }}", run: python atualizador.py --cnes-descobrir}, {name: coletar, if: "${{ inputs.so_cnj != true }}", run: python atualizador.py --auto}, {name: sondagem cnj, continue-on-error: true, run: python atualizador.py --cnj}, {name: publicar, run: bash publicar.sh}]}}
